name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Prepare the static artifact
        run: bash scripts/prepare-static.sh

      - name: Resolve the Cloudflare account
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          zone_response="$({
            curl -sS \
              'https://api.cloudflare.com/client/v4/zones?name=tutaemeia.pt' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          })"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone_response}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zone_response}")"

          if [[ -z "${account_id}" ]]; then
            account_response="$({
              curl -sS \
                'https://api.cloudflare.com/client/v4/accounts' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            })"
            account_id="$(jq -r 'if (.result | length) == 1 then .result[0].id else empty end' <<<"${account_response}")"
          fi

          if [[ -z "${account_id}" || -z "${zone_id}" ]]; then
            echo 'The token could not resolve exactly one Cloudflare account.' >&2
            jq -c '{success, errors}' <<<"${zone_response}" >&2
            exit 1
          fi

          echo "::add-mask::${account_id}"
          echo "::add-mask::${zone_id}"
          echo "account_id=${account_id}" >> "${GITHUB_OUTPUT}"
          echo "zone_id=${zone_id}" >> "${GITHUB_OUTPUT}"

      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail

          response="$({
            curl -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/tutaemeia" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          })"

          if jq -e '.success == true' <<<"${response}" >/dev/null; then
            exit 0
          fi

          response="$({
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"name":"tutaemeia","production_branch":"main"}'
          })"
          jq -e '.success == true' <<<"${response}" >/dev/null || {
            jq -c '{success, errors}' <<<"${response}" >&2
            exit 1
          }

      - name: Deploy the production site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          command: pages deploy .cloudflare-dist --project-name=tutaemeia --branch=main --commit-hash=${{ github.sha }}

      - name: Register the custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail

          current="$({
            curl -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/tutaemeia/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          })"

          for domain in tutaemeia.pt www.tutaemeia.pt; do
            if jq -e --arg domain "${domain}" 'any(.result[]?; .name == $domain)' <<<"${current}" >/dev/null; then
              continue
            fi

            response="$({
              curl -sS -X POST \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/tutaemeia/domains" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "$(jq -cn --arg domain "${domain}" '{name: $domain}')"
            })"
            jq -e '.success == true' <<<"${response}" >/dev/null || {
              jq -c '{success, errors}' <<<"${response}" >&2
              exit 1
            }
          done

      - name: Point the public domains to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
        run: |
          set -euo pipefail

          for domain in tutaemeia.pt www.tutaemeia.pt; do
            current="$({
              curl -sS --get \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --data-urlencode "name=${domain}"
            })"
            jq -e '.success == true' <<<"${current}" >/dev/null || {
              jq -c '{success, errors}' <<<"${current}" >&2
              exit 1
            }

            matching_id="$(jq -r '.result[] | select(.type == "CNAME" and .content == "tutaemeia.pages.dev") | .id' <<<"${current}" | head -n 1)"
            if [[ -n "${matching_id}" ]]; then
              response="$({
                curl -sS -X PATCH \
                  "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${matching_id}" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data '{"proxied":true,"ttl":1}'
              })"
              jq -e '.success == true' <<<"${response}" >/dev/null || {
                jq -c '{success, errors}' <<<"${response}" >&2
                exit 1
              }
              continue
            fi

            while IFS= read -r record_id; do
              response="$({
                curl -sS -X DELETE \
                  "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${record_id}" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
              })"
              jq -e '.success == true' <<<"${response}" >/dev/null || {
                jq -c '{success, errors}' <<<"${response}" >&2
                exit 1
              }
            done < <(jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"${current}")

            response="$({
              curl -sS -X POST \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "$(jq -cn --arg name "${domain}" '{type: "CNAME", name: $name, content: "tutaemeia.pages.dev", proxied: true, ttl: 1}')"
            })"
            jq -e '.success == true' <<<"${response}" >/dev/null || {
              jq -c '{success, errors}' <<<"${response}" >&2
              exit 1
            }
          done
